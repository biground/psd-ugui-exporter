[package]
name = "psdui-editor"
version = "0.1.0"
edition = "2021"

[lib]
name = "psdui_editor"
path = "src/lib.rs"

[[bin]]
name = "psdui-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
